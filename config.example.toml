# Fluent Copilot 配置模板：复制为 config.toml 后按需修改。
# config.toml 含密钥时不进 git（已在 .gitignore 中）。

[llm]
provider = "glm"
base_url = "https://open.bigmodel.cn/api/paas/v4/"
model = "glm-4.6"
# 模型选择器候选列表（切换在输入区底部，下一轮对话生效）
models = ["glm-4.6", "glm-4.5", "glm-4.5-air", "glm-4-flash"]
# 二选一：直接填 key；或留空，并设置环境变量 FLUENT_COPILOT_API_KEY
api_key = ""

[knowledge]
# Obsidian 知识库路径（66 页，关键词搜页名直读）
vault_path = './copilot_lib'

[fluent]
# -sifile 连接信息目录（start-fluent-copilot.bat 写入的位置）
sifile_dir = '%TEMP%/fluent-copilot'

[app]
log_dir = './logs'
max_tool_rounds = 30

[server]
# Web UI 本地服务（uvicorn + pywebview 同进程）
host = '127.0.0.1'
port = 8765
